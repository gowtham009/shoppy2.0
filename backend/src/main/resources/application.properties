# SerpAPI key is read from environment variable SERPAPI_KEY by default
serpapi.key=${SERPAPI_KEY:}

# Server port (optional)
server.port=8080

# H2 datasource for simple local persistence
spring.datasource.url=jdbc:h2:mem:gkshoppy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Load schema/data from data.sql
spring.sql.init.mode=always

# Stripe API key (leave empty to use local stub). Set STRIPE_API_KEY env var or override here.
stripe.apiKey=${STRIPE_API_KEY:}
