<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmation - GK Shoppy</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:1rem}</style>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <h1>Order Confirmation</h1>
  <div th:if="${order != null}">
    <p>Order ID: <span th:text="${order.id}">#</span></p>
    <p>Total: ₹<span id="orderTotal" th:text="${#numbers.formatDecimal(order.total,0,'POINT',2,'NONE')}">0</span></p>
    <p>Status: <span th:text="${order.status}">CREATED</span></p>
    <h3>Items</h3>
    <ul>
      <li th:each="it : ${order.items}">
        <span th:text="${it.product.name}">Product</span> — Qty: <span th:text="${it.quantity}">1</span>
      </li>
    </ul>
    <div style="margin-top:1rem">
        <div id="card-element" style="margin-bottom:.5rem"></div>
        <button id="payNow">Pay now</button>
        <div id="paymentResult" style="margin-top:.5rem;color:green"></div>
      </div>
  </div>
  <a href="/shop">Continue shopping</a> | <a href="/orders">View orders</a>

  <script>
    document.addEventListener('DOMContentLoaded', async function(){
      const btn = document.getElementById('payNow');
      if (!btn) return;

      // CSRF meta tags
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

      // Try to fetch Stripe publishable key
      let publishableKey = '';
      try {
        const cfg = await fetch('/payment/config');
        if (cfg.ok) {
          const cfgJson = await cfg.json();
          publishableKey = cfgJson.publishableKey || '';
        }
      } catch (e) { console.warn('Could not fetch payment config', e); }

      let stripe = null;
      let card = null;
      if (publishableKey) {
        stripe = Stripe(publishableKey);
        const elements = stripe.elements();
        card = elements.create('card');
        try { card.mount('#card-element'); } catch(e) { console.warn(e); }
      }

      btn.addEventListener('click', async function(){
        btn.disabled = true; btn.textContent = 'Processing...';
        const orderId = /*[[${order.id}]]*/ '0';
        const totalText = document.getElementById('orderTotal').textContent || '0';
        const amount = Math.round(parseFloat(totalText.replace(/[^0-9\.]/g,'')) * 100);
        try {
          // Create payment intent on server
          const params = new URLSearchParams(); params.append('orderId', orderId);
          const headers = {};
          if (csrfToken) headers[csrfHeader] = csrfToken;
          headers['Content-Type'] = 'application/x-www-form-urlencoded';

          const res = await fetch('/payment/create-intent', { method: 'POST', body: params, headers });
          const data = await res.json();

          if (!res.ok) {
            document.getElementById('paymentResult').style.color = 'red';
            document.getElementById('paymentResult').textContent = 'Error creating payment intent: ' + (data.message || data.error || res.statusText);
            return;
          }

          if (!data.clientSecret) {
            document.getElementById('paymentResult').style.color = 'red';
            document.getElementById('paymentResult').textContent = 'No client secret returned.';
            return;
          }

          if (stripe && card) {
            // Confirm card payment using Stripe.js
            const result = await stripe.confirmCardPayment(data.clientSecret, {
              payment_method: { card }
            });
            if (result.error) {
              document.getElementById('paymentResult').style.color = 'red';
              document.getElementById('paymentResult').textContent = 'Payment failed: ' + result.error.message;
            } else if (result.paymentIntent && result.paymentIntent.status === 'succeeded') {
              document.getElementById('paymentResult').style.color = 'green';
              document.getElementById('paymentResult').textContent = 'Payment succeeded!';
            } else {
              document.getElementById('paymentResult').style.color = 'orange';
              document.getElementById('paymentResult').textContent = 'Payment processing: ' + JSON.stringify(result);
            }
          } else {
            // No Stripe.js key — show clientSecret to support manual testing / server-side confirmation
            document.getElementById('paymentResult').textContent = 'Payment intent created: ' + data.clientSecret;
          }
        } catch (err) {
          document.getElementById('paymentResult').style.color = 'red';
          document.getElementById('paymentResult').textContent = 'Error: ' + err;
        } finally {
          btn.disabled = false; btn.textContent = 'Pay now';
        }
      });
    });
  </script>
</body>
</html>
