<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - GK Shoppy</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:1rem} table{width:100%;border-collapse:collapse} th,td{padding:0.5rem;border-bottom:1px solid #eee}</style>
</head>
<body>
  <h1>Your Cart</h1>
  <a href="/">Continue shopping</a>
  <div th:if="${items.size()}==0">Your cart is empty</div>
  <table th:if="${items.size()} &gt; 0">
    <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead>
    <tbody>
      <tr th:each="entry : ${items}">
        <td th:text="${entry.key.name}">Name</td>
        <td th:text="${entry.value}">1</td>
        <td>₹<span th:text="${#numbers.formatDecimal(entry.key.price,0,'POINT',2,'NONE')}">0</span></td>
        <td>₹<span th:text="${#numbers.formatDecimal(entry.key.price * entry.value,0,'POINT',2,'NONE')}">0</span></td>
        <td>
          <form th:action="@{/cart/remove}" method="post">
             <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="productId" th:value="${entry.key.id}" />
            <button type="submit">Remove</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <h3 th:if="${total != null}">Total: ₹<span th:text="${#numbers.formatDecimal(total,0,'POINT',2,'NONE')}">0</span></h3>
</body>
</html>
