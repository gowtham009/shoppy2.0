<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth - GK Shoppy</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:1rem} form{margin-bottom:1rem}</style>
</head>
<body>
  <h1>Sign In / Sign Up</h1>
  <div th:if="${error}" style="color:red;background:#fee;padding:0.5rem;border-radius:4px;margin-bottom:1rem" th:text="${error}">Error</div>

  <section style="display:flex;gap:2rem">
    <div>
      <h2>Sign In</h2>
      <form th:action="@{/auth/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Email or Username:<br/><input name="emailOrUsername"/></label><br/>
        <label>Password:<br/><input name="password" type="password"/></label><br/>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div>
      <h2>Sign Up</h2>
      <form th:action="@{/auth/signup}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Email:<br/><input name="email" required/></label><br/>
        <label>Username:<br/><input name="username" required/></label><br/>
        <label>Password:<br/><input name="password" type="password" required/></label><br/>
        <button type="submit">Create account</button>
      </form>
    </div>
  </section>
</body>
</html>
