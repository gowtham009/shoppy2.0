<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GK Shoppy - Search</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 2rem; }
    input[type=text] { width: 60%; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    pre { background:#f6f6f6; padding:1rem; border-radius:6px; }
  </style>
</head>
<body>
  <h1>GK Shoppy — Product Search (Google Shopping via SerpAPI)</h1>
  <form id="searchForm" action="/api/search" method="get" onsubmit="return doSearch(event);">
    <input type="text" name="q" id="q" placeholder="Search for products" />
    <button type="submit">Search</button>
  </form>

  <h2>Results</h2>
  <pre id="results">No results yet</pre>

  <script>
    async function doSearch(e) {
      e.preventDefault();
      const q = document.getElementById('q').value;
      if (!q) return false;
      const resEl = document.getElementById('results');
      resEl.textContent = 'Loading...';
      try {
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        const text = await r.text();
        try { const json = JSON.parse(text); resEl.textContent = JSON.stringify(json, null, 2); }
        catch (err) { resEl.textContent = text; }
      } catch (err) {
        resEl.textContent = 'Error: ' + err;
      }
      return false;
    }
  </script>
</body>
</html>
